name: 2027 Evals
description: Run a 2027.dev eval on a PR's preview deployment and post results back to the PR.
author: 2027.dev

inputs:
  api-key:
    description: 2027.dev API key (create one at /<orgDomain>/settings)
    required: true
  api-base-url:
    description: Base URL for the 2027 evals API
    required: false
    default: https://2027.dev/evals
  prompt-id:
    description: Prompt UUID. List available IDs via GET /api/v1/prompts.
    required: true
  url-map:
    description: 'JSON object mapping production hostnames to preview URLs (full http(s) URLs required), e.g. {"acme.com":"https://deploy-preview-1.netlify.app"}'
    required: true
  deployment-url:
    description: Preview deployment URL. Required when url-map has more than one entry (validated at runtime).
    required: false
  wait-timeout-minutes:
    description: How long to poll for completion before returning (action exits 0 on timeout)
    required: false
    default: "20"
  poll-interval-seconds:
    description: Seconds between status polls
    required: false
    default: "20"
  timeout-fails:
    description: When 'true', a polling timeout marks the commit status as failure (blocks merge). Default 'false' marks it success so the check doesn't get stuck pending.
    required: false
    default: "false"
  skip-comment:
    description: When 'true', the action does not post or update the sticky PR comment. Use this if you want to render your own comment from the action's outputs.
    required: false
    default: "false"
  skip-status:
    description: When 'true', the action does not set the commit status check. Use this if you want to set your own status from the action's outputs.
    required: false
    default: "false"
  github-token:
    description: GitHub token for posting PR comments and commit statuses (defaults to github.token)
    required: false
    default: ${{ github.token }}

outputs:
  run-id:
    description: UUID of the eval run on 2027
  status-url:
    description: API endpoint that reflects the run's current state
  final-status:
    description: Terminal state observed before the action exited — completed | failed | superseded | running (the last on timeout)
  prompt-title:
    description: Human-readable title of the evaluated prompt
  report-slug:
    description: Report slug if the run produced a scorable report, empty string otherwise
  report-url:
    description: Full URL to the dashboard report page, empty string if no report
  failure-reason:
    description: Server-provided failure reason if the run failed, empty string otherwise

runs:
  using: composite
  steps:
    - name: Run 2027 eval
      uses: actions/github-script@v7
      env:
        EVALS_API_KEY: ${{ inputs.api-key }}
        EVALS_API_BASE_URL: ${{ inputs.api-base-url }}
        EVALS_PROMPT_ID: ${{ inputs.prompt-id }}
        EVALS_URL_MAP: ${{ inputs.url-map }}
        EVALS_DEPLOYMENT_URL: ${{ inputs.deployment-url }}
        EVALS_WAIT_TIMEOUT_MINUTES: ${{ inputs.wait-timeout-minutes }}
        EVALS_POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
        EVALS_TIMEOUT_FAILS: ${{ inputs.timeout-fails }}
        EVALS_SKIP_COMMENT: ${{ inputs.skip-comment }}
        EVALS_SKIP_STATUS: ${{ inputs.skip-status }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path')
          const run = require(path.join(process.env.GITHUB_ACTION_PATH, 'scripts', 'run.js'))
          await run({ core, github, context })
